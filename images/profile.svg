<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-label="Illustration of a man in his 30s wearing glasses and a casual t-shirt">
  <rect width="400" height="400" fill="#cfece6" />
  <circle cx="330" cy="70" r="46" fill="#e7f6f3" />
  <circle cx="60" cy="120" r="28" fill="#a8dcd2" opacity="0.5" />

  <!-- upper body: casual t-shirt -->
  <path d="M30 400 C30 335 80 302 158 288 L242 288 C320 302 370 335 370 400 Z" fill="#5b8db8" />
  <path d="M158 288 C120 300 90 320 78 400 L60 400 C62 335 100 302 158 288 Z" fill="#4a7aa3" opacity="0.5" />

  <!-- neck -->
  <path d="M172 232 H228 V292 Q200 322 172 292 Z" fill="#e6b68d" />
  <path d="M172 262 Q200 282 228 262 V272 Q200 292 172 272 Z" fill="#d9a47e" opacity="0.6" />
  <!-- collar -->
  <path d="M160 286 Q200 338 240 286" fill="none" stroke="#3f6a8f" stroke-width="9" stroke-linecap="round" />

  <!-- ears -->
  <ellipse cx="139" cy="182" rx="10" ry="16" fill="#eec19a" />
  <ellipse cx="261" cy="182" rx="10" ry="16" fill="#eec19a" />

  <!-- face -->
  <ellipse cx="200" cy="172" rx="62" ry="76" fill="#f3cfaa" />

  <!-- hair -->
  <path d="M136 166 C124 92 164 66 206 68 C252 68 278 100 264 166 C256 138 244 120 218 114 C196 124 164 122 136 166 Z" fill="#1f1b1a" />

  <!-- eyebrows -->
  <path d="M158 150 Q174 143 190 149" fill="none" stroke="#1f1b1a" stroke-width="5" stroke-linecap="round" />
  <path d="M210 149 Q226 143 242 150" fill="none" stroke="#1f1b1a" stroke-width="5" stroke-linecap="round" />

  <!-- eyes -->
  <ellipse cx="172" cy="173" rx="6" ry="3.6" fill="#1f1b1a" />
  <ellipse cx="228" cy="173" rx="6" ry="3.6" fill="#1f1b1a" />

  <!-- glasses -->
  <rect x="151" y="156" width="42" height="32" rx="12" fill="#ffffff" fill-opacity="0.18" stroke="#2b2b33" stroke-width="4" />
  <rect x="207" y="156" width="42" height="32" rx="12" fill="#ffffff" fill-opacity="0.18" stroke="#2b2b33" stroke-width="4" />
  <path d="M193 168 Q200 162 207 168" fill="none" stroke="#2b2b33" stroke-width="4" stroke-linecap="round" />
  <path d="M151 167 L141 165 M249 167 L259 165" stroke="#2b2b33" stroke-width="4" stroke-linecap="round" />

  <!-- nose, cheeks, mouth -->
  <path d="M200 180 Q195 199 203 205" fill="none" stroke="#d9a47e" stroke-width="3" stroke-linecap="round" />
  <circle cx="160" cy="206" r="11" fill="#eaa08a" opacity="0.28" />
  <circle cx="240" cy="206" r="11" fill="#eaa08a" opacity="0.28" />
  <path d="M184 224 Q200 237 216 224" fill="none" stroke="#a85a4a" stroke-width="4" stroke-linecap="round" />
</svg>
