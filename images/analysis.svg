<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Illustration of a TEM cross-section image of a transistor, an SEM beam view and an EDS spectrum">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c2410c" />
      <stop offset="1" stop-color="#7c2d12" />
    </linearGradient>
    <pattern id="lattice" width="14" height="14" patternUnits="userSpaceOnUse">
      <circle cx="7" cy="7" r="2.2" fill="#ffedd5" opacity="0.55" />
    </pattern>
    <clipPath id="frame"><rect x="40" y="40" width="480" height="520" rx="24" /></clipPath>
  </defs>

  <rect width="800" height="600" fill="url(#bg)" />

  <!-- TEM cross-section image -->
  <g clip-path="url(#frame)">
    <rect x="40" y="40" width="480" height="520" fill="#2e1a10" />
    <!-- metal interconnect layers -->
    <rect x="40" y="70" width="480" height="26" fill="#d9732a" opacity="0.85" />
    <rect x="40" y="130" width="480" height="26" fill="#d9732a" opacity="0.7" />
    <rect x="100" y="96" width="14" height="34" fill="#fdba74" opacity="0.8" />
    <rect x="310" y="96" width="14" height="34" fill="#fdba74" opacity="0.8" />
    <rect x="205" y="156" width="14" height="74" fill="#fdba74" opacity="0.8" />
    <rect x="415" y="156" width="14" height="74" fill="#fdba74" opacity="0.8" />
    <!-- substrate with atomic lattice -->
    <rect x="40" y="430" width="480" height="130" fill="#b8683a" />
    <rect x="40" y="430" width="480" height="130" fill="url(#lattice)" />
    <!-- fins -->
    <g>
      <rect x="88" y="250" width="48" height="180" fill="#f0a868" />
      <rect x="88" y="250" width="48" height="180" fill="url(#lattice)" />
      <rect x="193" y="250" width="48" height="180" fill="#f0a868" />
      <rect x="193" y="250" width="48" height="180" fill="url(#lattice)" />
      <rect x="298" y="250" width="48" height="180" fill="#f0a868" />
      <rect x="298" y="250" width="48" height="180" fill="url(#lattice)" />
      <rect x="403" y="250" width="48" height="180" fill="#f0a868" />
      <rect x="403" y="250" width="48" height="180" fill="url(#lattice)" />
    </g>
    <!-- gates wrapping the fins -->
    <g fill="#ffedd5" fill-opacity="0.9" stroke="#fdba74" stroke-width="3">
      <rect x="72" y="232" width="80" height="78" rx="10" />
      <rect x="177" y="232" width="80" height="78" rx="10" />
      <rect x="282" y="232" width="80" height="78" rx="10" />
      <rect x="387" y="232" width="80" height="78" rx="10" />
    </g>
    <!-- scale bar -->
    <rect x="60" y="522" width="90" height="5" fill="#ffffff" />
    <text x="60" y="515" fill="#ffffff" font-family="Arial, sans-serif" font-size="16" font-weight="700">5 nm</text>
  </g>
  <rect x="40" y="40" width="480" height="520" rx="24" fill="none" stroke="#fdba74" stroke-width="3" />
  <text x="62" y="76" fill="#ffedd5" font-family="Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="2">TEM</text>

  <!-- SEM beam view -->
  <rect x="550" y="40" width="210" height="250" rx="24" fill="#2e1a10" stroke="#fdba74" stroke-width="3" />
  <circle cx="655" cy="150" r="78" fill="none" stroke="#d9732a" stroke-width="2" />
  <circle cx="655" cy="150" r="54" fill="none" stroke="#fdba74" stroke-width="2" opacity="0.8" />
  <circle cx="655" cy="150" r="28" fill="none" stroke="#ffedd5" stroke-width="2" />
  <circle cx="655" cy="150" r="8" fill="#ffedd5" />
  <path d="M655 62V238M567 150H743" stroke="#fdba74" stroke-width="1.5" opacity="0.6" />
  <text x="570" y="76" fill="#ffedd5" font-family="Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="2">SEM</text>
  <text x="570" y="268" fill="#fdba74" font-family="Arial, sans-serif" font-size="13">e-beam 5 kV</text>

  <!-- EDS spectrum -->
  <rect x="550" y="320" width="210" height="240" rx="24" fill="#2e1a10" stroke="#fdba74" stroke-width="3" />
  <path d="M570 520H740" stroke="#fdba74" stroke-width="2" />
  <polyline points="570,516 596,512 610,470 622,512 648,508 664,400 678,508 700,504 714,450 726,504 740,500" fill="none" stroke="#ffedd5" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" />
  <text x="570" y="356" fill="#ffedd5" font-family="Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="2">EDS</text>
  <text x="570" y="548" fill="#fdba74" font-family="Arial, sans-serif" font-size="13">Elemental analysis</text>
</svg>
